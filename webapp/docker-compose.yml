# Sobe a webapp em container e a mantém rodando.
#   export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_DEFAULT_REGION=us-east-1
#   docker compose up -d --build
# UI: http://localhost:8088  (host 8088 -> container 8001)
services:
  webapp:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    image: myp-webapp:latest
    container_name: myp-webapp
    ports:
      - "8088:8001"
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      MYP_BASE_URL: ${MYP_BASE_URL:-https://018e6ro2ka.execute-api.us-east-1.amazonaws.com/dev/api/v1}
      DYNAMO_TABLE: ${DYNAMO_TABLE:-myp-cards-files-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./data:/app/webapp/data   # persiste o SQLite dos jobs
    restart: unless-stopped
