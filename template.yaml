AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MYP Cards - Atualização em Massa com SQS

Parameters:
  Environment:
    Type: String
    Description: 'Deployment environment name (dev, staging, prod)'
  ProjectName:
    Type: String
    Default: 'myp-cards'
    Description: 'Project name for resource naming'

Globals:
  Function:
    Timeout: 900
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref FilesTable
        INVENTORY_JOBS_TABLE: !Ref InventoryJobsTable
        INVENTORY_DATA_TABLE: !Ref InventoryDataTable
        INVENTORY_BUCKET: !Ref InventoryBucket
        MYP_USERNAME: "17mariavitoria.argolo@gmail.com"
        MYP_PASSWORD: "Mar0809."
        MYP_USERNAME_URL: "Mavipoke"
        CHUNK_SIZE: "50"

Resources:
  # IAM Role padrão para Lambdas
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${ProjectName}-lambda-policy-${Environment}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - dynamodb:*
                  - sqs:*
                  - logs:*
                  - lambda:InvokeFunction
                Resource: '*'

  # Lambda para scraping de inventário
  InventoryScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-inventory-scraper-${Environment}
      CodeUri: .
      Handler: lambda_scrape_inventory.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: "Scraping diário do inventário"
            Enabled: true

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # S3 Bucket para CSVs
  CsvBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-csv-${Environment}-${AWS::AccountId}
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProducerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: csv-uploads/
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProducerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: csv-excluir/
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProducerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: csv-recadastrar/

  # SQS Queue
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub queue-${ProjectName}-processing-${Environment}
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20

  # SQS Queue para Precificação Diária
  PricingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub queue-${ProjectName}-pricing-${Environment}
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20

  # DLQ
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub queue-${ProjectName}-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  # DynamoDB
  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-files-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH

  # DynamoDB - Inventory Jobs
  InventoryJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-inventory-jobs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # DynamoDB - Inventory Data (última contagem)
  InventoryDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-inventory-data-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: job_id-index
          KeySchema:
            - AttributeName: job_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # S3 Bucket para Inventory
  InventoryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-inventory-${Environment}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldInventories
            Status: Enabled
            ExpirationInDays: 7

  # Layer
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${ProjectName}-deps-${Environment}
      Description: Dependências Python
      ContentUri: ./layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete

  # Lambda: API Proxy (todos os endpoints)
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-api-${Environment}
      CodeUri: ./
      Handler: lambdas.api_handler.handler
      Timeout: 60
      MemorySize: 1024
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref DependenciesLayer
      Environment:
        Variables:
          S3_BUCKET: !Ref CsvBucket
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY

  # Lambda: Producer
  ProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-producer-${Environment}
      CodeUri: lambdas/
      Handler: producer.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          QUEUE_URL: !Ref ProcessingQueue

  ProducerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProducerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt CsvBucket.Arn

  # Lambda: Consumer
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-consumer-${Environment}
      CodeUri: ./
      Handler: lambdas.consumer.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref DependenciesLayer
      Environment:
        Variables:
          MYP_DELETE_DELAY_SECONDS: "0.25"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            Enabled: true
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 50

  # Lambda: Inventory Scraper (paralelo)
  InventoryScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-inventory-scraper-${Environment}
      CodeUri: ./
      Handler: lambdas.inventory_scraper.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref DependenciesLayer

Outputs:
  ApiUrl:
    Description: URL da API
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  
  CsvBucketName:
    Description: Nome do bucket S3
    Value: !Ref CsvBucket
  
  QueueUrl:
    Description: URL da fila SQS
    Value: !Ref ProcessingQueue
  
  FilesTableName:
    Description: Nome da tabela DynamoDB
    Value: !Ref FilesTable
  
  InventoryBucketName:
    Description: Nome do bucket S3 de inventário
    Value: !Ref InventoryBucket
  
  InventoryJobsTableName:
    Description: Nome da tabela DynamoDB de jobs de inventário
    Value: !Ref InventoryJobsTable
  
  InventoryDataTableName:
    Description: Nome da tabela DynamoDB de dados de inventário
    Value: !Ref InventoryDataTable
