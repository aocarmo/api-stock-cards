name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Create S3 bucket for deployment
        run: |
          aws s3 mb s3://myp-cards-deploy --region us-east-1 || echo "Bucket already exists"
      
      - name: Create layer
        run: |
          mkdir -p layer/python
          pip install -r requirements.txt -t layer/python/
      
      - name: SAM Build
        run: sam build
      
      - name: SAM Deploy
        run: |
          sam deploy \
            --config-env staging \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      
      - name: Configure S3 Notification
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="myp-cards-csv-staging-${AWS_ACCOUNT_ID}"
          LAMBDA_ARN=$(aws lambda get-function --function-name myp-cards-producer-staging --query 'Configuration.FunctionArn' --output text)
          
          aws s3api put-bucket-notification-configuration \
            --bucket $BUCKET_NAME \
            --notification-configuration '{
              "LambdaFunctionConfigurations": [
                {
                  "LambdaFunctionArn": "'$LAMBDA_ARN'",
                  "Events": ["s3:ObjectCreated:*"],
                  "Filter": {
                    "Key": {
                      "FilterRules": [
                        {"Name": "prefix", "Value": "csv-uploads/"},
                        {"Name": "suffix", "Value": ".csv"}
                      ]
                    }
                  }
                },
                {
                  "LambdaFunctionArn": "'$LAMBDA_ARN'",
                  "Events": ["s3:ObjectCreated:*"],
                  "Filter": {
                    "Key": {
                      "FilterRules": [
                        {"Name": "prefix", "Value": "csv-excluir/"},
                        {"Name": "suffix", "Value": ".csv"}
                      ]
                    }
                  }
                },
                {
                  "LambdaFunctionArn": "'$LAMBDA_ARN'",
                  "Events": ["s3:ObjectCreated:*"],
                  "Filter": {
                    "Key": {
                      "FilterRules": [
                        {"Name": "prefix", "Value": "csv-recadastrar/"},
                        {"Name": "suffix", "Value": ".csv"}
                      ]
                    }
                  }
                }
              ]
            }'
